version: "3.9"

services:
  smallcap-bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: smallcap-bot
    restart: always                  # auto-restart on crash or host reboot
    env_file:
      - ../.env
    volumes:
      - ../smallcap/logs:/app/smallcap/logs   # persist logs outside container
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "/app/scripts/health_check.py"]
      interval: 30m
      timeout: 30s
      retries: 3
      start_period: 60s
